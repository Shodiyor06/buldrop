services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: buldrop
      POSTGRES_USER: buldrop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-buldrop-dev-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buldrop -d buldrop"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
    command: sh -c "python manage.py migrate && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --access-logfile -"
    environment:
      DEBUG: ${DEBUG:-True}
      SECRET_KEY: ${SECRET_KEY:-insecure-development-only-secret-replace-before-production}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-insecure-development-only-jwt-secret-replace-before-production}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      DATABASE_URL: postgres://buldrop:${POSTGRES_PASSWORD:-buldrop-dev-only}@db:5432/buldrop
      REDIS_URL: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: ${CELERY_TASK_ALWAYS_EAGER:-True}
      PAYMENT_MODE: ${PAYMENT_MODE:-test}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8080}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:3000,http://localhost:8080}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      ORDER_EXPIRY_MINUTES: ${ORDER_EXPIRY_MINUTES:-60}
      CLICK_SERVICE_ID: ${CLICK_SERVICE_ID:-}
      CLICK_MERCHANT_USER_ID: ${CLICK_MERCHANT_USER_ID:-}
      PAYME_CHECKOUT_URL: ${PAYME_CHECKOUT_URL:-https://checkout.paycom.uz}
      STEAM_TRADE_MODE: ${STEAM_TRADE_MODE:-manual}
      STEAM_BOT_URL: ${STEAM_BOT_URL:-}
      STEAM_BOT_API_KEY: ${STEAM_BOT_API_KEY:-}
      STEAM_BOT_WEBHOOK_SECRET: ${STEAM_BOT_WEBHOOK_SECRET:-}
      PLAYPAY_API_URL: ${PLAYPAY_API_URL:-https://playpay.uz/app/api}
      PLAYPAY_API_KEY: ${PLAYPAY_API_KEY:-}
      CLICK_MERCHANT_ID: ${CLICK_MERCHANT_ID:-}
      CLICK_SECRET_KEY: ${CLICK_SECRET_KEY:-}
      PAYME_MERCHANT_KEY: ${PAYME_MERCHANT_KEY:-}
      PAYME_SECRET_KEY: ${PAYME_SECRET_KEY:-}
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery:
    build:
      context: ./backend
    command: celery -A config worker -B --loglevel=info
    environment:
      DEBUG: ${DEBUG:-True}
      SECRET_KEY: ${SECRET_KEY:-insecure-development-only-secret-replace-before-production}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-insecure-development-only-jwt-secret-replace-before-production}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      DATABASE_URL: postgres://buldrop:${POSTGRES_PASSWORD:-buldrop-dev-only}@db:5432/buldrop
      REDIS_URL: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "False"
      STEAM_TRADE_MODE: ${STEAM_TRADE_MODE:-manual}
      STEAM_BOT_URL: ${STEAM_BOT_URL:-}
      STEAM_BOT_API_KEY: ${STEAM_BOT_API_KEY:-}
      STEAM_BOT_WEBHOOK_SECRET: ${STEAM_BOT_WEBHOOK_SECRET:-}
      PAYMENT_MODE: ${PAYMENT_MODE:-test}
      ORDER_EXPIRY_MINUTES: ${ORDER_EXPIRY_MINUTES:-60}
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: /api/v1
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: /api/v1
      NEXT_PUBLIC_APP_NAME: BulDrop
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  pgdata:
